<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Host</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #f4f4f4; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; padding: 20px; }
        .img-container { background: white; padding: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        img { width: 527px; height: 682px; display: block; object-fit: cover; }
        p { text-align: center; font-size: 12px; color: #666; margin-top: 8px; }
    </style>
</head>
<body>
    <h1>My Image Assets</h1>
    <div class="grid">
        <div class="img-container">
            <img src="./cover.png" alt="Cover Image">
            <p>Cover</p>
        </div>
        <div class="img-container">
            <img src="./speaker_1.png" alt="Speaker 1">
            <p>Speaker 1</p>
        </div>
        <div class="img-container">
            <img src="./speaker_2.png" alt="Speaker 2">
            <p>Speaker 2</p>
        </div>
        <div class="img-container">
            <img src="./speaker_3.png" alt="Speaker 3">
            <p>Speaker 3</p>
        </div>
    </div>
</body>
</html>
